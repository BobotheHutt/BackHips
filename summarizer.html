<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobility Hub - Reading Summarizer</title>
    <script src="https://tailwindcss.com"></script>
    <script type="module">
        import { pipeline } from 'https://jsdelivr.net';
        window.pipeline = pipeline;
    </script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen flex flex-col">

    <!-- Top Navigation Tabs -->
    <header class="bg-indigo-900 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 flex justify-between items-center">
            <h1 class="text-3xl font-extrabold tracking-tight py-4">Mobility Hub</h1>
            <nav class="flex h-full align-bottom self-end">
                <a href="index.html" class="hover:bg-indigo-800 text-slate-300 hover:text-white px-6 py-4 rounded-t-xl text-xl font-bold transition-all">Hip Support</a>
                <a href="back.html" class="hover:bg-indigo-800 text-slate-300 hover:text-white px-6 py-4 rounded-t-xl text-xl font-bold transition-all">Back Support</a>
                <a href="summarizer.html" class="bg-slate-50 text-indigo-900 px-6 py-4 rounded-t-xl text-xl font-bold transition-all border-b-2 border-slate-50">Reading Summarizer</a>
            </nav>
        </div>
    </header>

    <!-- Main Content Window -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-6 flex flex-col gap-6">
        <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
            <h3 class="text-3xl font-extrabold text-slate-800 mb-2">Free Browser-Based AI Summarizer</h3>
            <p class="text-lg text-slate-500 mb-6">Paste long research articles, medical papers, or informational text to isolate key functional takeaways instantly.</p>
            
            <textarea id="text-input" class="w-full h-64 p-4 border-2 border-slate-300 rounded-xl text-xl focus:border-indigo-500 focus:ring-0 mb-4" placeholder="Right-click here and paste your reading text..."></textarea>
            
            <button onclick="runBrowserSummary()" id="sum-btn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-2xl py-5 px-8 rounded-xl shadow transition-all active:scale-[0.99]">
                ⚡ Summarize Now
            </button>

            <!-- Status Box -->
            <div id="status-box" class="mt-6 p-4 bg-slate-100 rounded-xl text-lg text-slate-700 font-medium hidden flex items-center gap-3">
                <span class="animate-spin text-xl">⏳</span>
                <span id="status-text">Processing...</span>
            </div>

            <!-- Output Box -->
            <div id="summary-output-box" class="mt-8 p-6 bg-slate-50 rounded-xl border border-slate-200 hidden">
                <h4 class="text-2xl font-bold text-slate-800 mb-3">Your Condensed Summary:</h4>
                <div id="summary-text" class="text-xl text-slate-700 leading-relaxed whitespace-pre-line font-medium"></div>
            </div>
        </div>
    </main>

    <script>
        let summarizerPipeline = null;

        async function runBrowserSummary() {
            const text = document.getElementById('text-input').value.trim();
            const btn = document.getElementById('sum-btn');
            const statusBox = document.getElementById('status-box');
            const statusText = document.getElementById('status-text');
            const outputBox = document.getElementById('summary-output-box');
            const outputText = document.getElementById('summary-text');

            if (!text) {
                alert("Please paste text before requesting a summary.");
                return;
            }

            btn.disabled = true;
            statusBox.classList.remove('hidden');
            outputBox.classList.add('hidden');

            try {
                if (!summarizerPipeline) {
                    statusText.innerText = "Initializing processing framework directly in browser cache (Initial launch takes ~30 seconds)...";
                    summarizerPipeline = await window.pipeline('summarization', 'Xenova/distilbart-cnn-6-6');
                }

                statusText.innerText = "Analyzing source material text patterns locally...";
                const result = await summarizerPipeline(text, {
                    max_length: 90, min_length: 25, length_penalty: 2.0, num_beams: 2
                });

                let cleanOutput = result.summary_text.replace(/\s+([.,!?:])/g, '$1').replace(/\. /g, '.\n• ');
                outputText.innerHTML = "• " + cleanOutput;
                outputBox.classList.remove('hidden');
            } catch (err) {
                console.error(err);
                alert("Processing Exception: " + err.message);
            } finally {
                btn.disabled = false;
                statusBox.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
