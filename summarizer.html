<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading Summarizer Frame</title>
    <!-- Free WebGPU/WASM In-Browser AI Engine -->
    <script type="module">
        import { pipeline } from 'https://jsdelivr.net';
        window.pipeline = pipeline;
    </script>
    <style>
        /* Tool-Shop Workspace Styles */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: #121824; 
            color: #e2e8f0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 24px;
            line-height: 1.6;
        }

        /* Centered Reading Layout Container */
        main { 
            max-width: 850px; 
            margin: 0 auto; 
            width: 100%;
        }
        .panel-card {
            background-color: #1e293b;
            border: 2px solid #334155;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .content-title { 
            font-size: 28px; 
            font-weight: 900; 
            color: #ffffff; 
            border-bottom: 2px solid #334155; 
            padding-bottom: 8px; 
            margin-bottom: 16px; 
        }
        .content-p { 
            font-size: 17px; 
            color: #94a3b8; 
            margin-bottom: 24px; 
        }

        /* Large Copy-Paste Input Box */
        textarea {
            width: 100%;
            height: 260px;
            background-color: #0f172a;
            border: 2px solid #334155;
            border-radius: 12px;
            padding: 16px;
            color: #ffffff;
            font-size: 18px;
            outline: none;
            resize: vertical;
        }
        textarea:focus { border-color: #0284c7; }
        
        /* Heavy Duty Action Button */
        .action-btn {
            width: 100%;
            background: linear-gradient(180deg, #059669 0%, #047857 100%); 
            border: none;
            color: #ffffff;
            font-size: 20px;
            font-weight: 900;
            padding: 18px;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(4, 120, 87, 0.3);
            margin-top: 16px;
        }
        .action-btn:active { transform: scale(0.99); }
        .action-btn:disabled { background: #334155; color: #64748b; cursor: not-allowed; box-shadow: none; }

        /* Loading & Results Containers */
        .status-panel { 
            background-color: #0f172a; 
            padding: 16px; 
            border-radius: 12px; 
            margin-top: 16px; 
            display: none; 
            align-items: center; 
            gap: 12px; 
            font-weight: 700; 
            color: #cbd5e1; 
        }
        .output-panel { 
            background-color: #0f172a; 
            border-left: 4px solid #059669; 
            padding: 24px; 
            border-radius: 0 12px 12px 0; 
            margin-top: 24px; 
            display: none; 
        }
    </style>
</head>
<body>

    <main>
        <div class="panel-card">
            <h3 class="content-title">Information Summarizer</h3>
            <p class="content-p">Paste long articles, printed exercises, or internet health guides here. The tool will automatically strip out technical fluff and give you simple, direct bullet points instantly.</p>
            
            <textarea id="text-input" placeholder="Right-click here and select Paste to drop long reading text..."></textarea>
            <button onclick="executeBrowserAILogic()" id="sum-btn" class="action-btn">⚡ Summarize Text Now</button>

            <!-- Loading Indicator Panel -->
            <div id="processing-status-panel" class="status-panel">
                <span id="processing-status-text">Awaiting text input...</span>
            </div>

            <!-- Output Panel -->
            <div id="processing-output-panel" class="output-panel">
                <h4 style="font-size: 14px; font-weight: 900; color: #059669; text-transform: uppercase; margin-bottom: 8px;">Main Takeaways</h4>
                <div id="processing-output-text" style="font-size: 18px; color: #e2e8f0; font-weight: 600; white-space: pre-line;"></div>
            </div>
        </div>
    </main>

    <script>
        let localModelPipeline = null;

        async function executeBrowserAILogic() {
            const srcText = document.getElementById('text-input').value.trim();
            const actionBtn = document.getElementById('sum-btn');
            const statusBox = document.getElementById('processing-status-panel');
            const statusLabel = document.getElementById('processing-status-text');
            const outputBox = document.getElementById('processing-output-panel');
            const outputLabel = document.getElementById('processing-output-text');

            if (!srcText) {
                alert("Please input text inside the text area first.");
                return;
            }

            actionBtn.disabled = true;
            statusBox.style.display = 'flex';
            outputBox.style.display = 'none';

            try {
                if (!localModelPipeline) {
                    statusLabel.innerText = "Setting up the local summary tool (First time takes about 30 seconds)...";
                    localModelPipeline = await window.pipeline('summarization', 'Xenova/distilbart-cnn-6-6');
                }

                statusLabel.innerText = "Analyzing text and creating short points...";
                const inference = await localModelPipeline(srcText, {
                    max_length: 90, min_length: 30, length_penalty: 2.0, num_beams: 2
                });

                let parsed = inference.summary_text.replace(/\s+([.,!?:])/g, '$1').replace(/\. /g, '.\n• ');
                outputLabel.innerHTML = "• " + parsed;
                outputBox.style.display = 'block';
            } catch (err) {
                console.error(err);
                alert("Error processing text: " + err.message);
            } finally {
                actionBtn.disabled = false;
                statusBox.style.display = 'none';
            }
        }
    </script>
</body>
</html>
