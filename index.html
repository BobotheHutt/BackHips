<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobility Hub Reference Portal</title>
    <style>
        /* Core Layout Styles */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: #121824; 
            color: #e2e8f0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* Keeps the main page solid while the frames scroll */
        }

        /* Top Industrial Header Box */
        header {
            background-color: #1e293b;
            border-bottom: 3px solid #334155;
            padding-top: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            flex-shrink: 0;
        }
        .header-container {
            max-w: 1400px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .logo-area h1 {
            color: #ffffff;
            font-size: 32px;
            font-weight: 900;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-icon {
            background-color: #0284c7;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 20px;
        }
        .subtitle {
            color: #94a3b8;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 4px;
            margin-bottom: 20px;
        }

        /* Heavy Machinery Navigation Tabs */
        nav { display: flex; gap: 8px; margin-bottom: -3px; }
        .tab-btn {
            background-color: #0f172a;
            color: #64748b;
            border: 3px solid #334155;
            border-bottom: none;
            padding: 14px 28px;
            font-size: 18px;
            font-weight: 800;
            border-radius: 12px 12px 0 0;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .tab-btn:hover { color: #f8fafc; background-color: #1e293b; }
        .active-tab {
            background-color: #121824 !important; /* Matches body background color */
            color: #38bdf8 !important; /* Industrial Blue Accent */
            border-color: #0284c7 !important;
            border-bottom: 3px solid #121824 !important;
            box-shadow: 0 -4px 15px rgba(2, 132, 199, 0.2);
            z-index: 10;
        }

        /* Central Frame Workspace Window */
        .workspace-container {
            flex-1: 1;
            width: 100%;
            height: calc(100vh - 125px); /* Dynamically scales to fit remaining laptop screen height */
            background-color: #121824;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background-color: transparent;
        }
    </style>
</head>
<body>

    <!-- Upper Control Dash Panel Frame -->
    <header>
        <div class="header-container">
            <div class="logo-area">
                <h1><span class="logo-icon">🔧</span> Mobility Hub</h1>
                <p class="subtitle">Reference & Reading Console</p>
            </div>
            <nav>
                <button onclick="loadContentFrame('hip.html', 'tab-hip')" id="tab-hip" class="tab-btn active-tab">🦿 Hip System</button>
                <button onclick="loadContentFrame('back.html', 'tab-back')" id="tab-back" class="tab-btn">⚙️ Back System</button>
                <button onclick="loadContentFrame('summarizer.html', 'tab-summarizer')" id="tab-summarizer" class="tab-btn">⚡ Reading Summarizer</button>
            </nav>
        </div>
    </header>

    <!-- Master Viewing Window (Pulls files from repository into view dynamically) -->
    <div class="workspace-container">
        <iframe id="content-frame" src="hip.html" title="Mobility Content Window"></iframe>
    </div>

    <!-- Central Script Controller -->
    <!-- Central Script Controller -->
    <script>
        function loadContentFrame(targetPage, clickedTabId) {
            // Generates a unique number based on the exact time to trick the browser into clearing cache
            const cacheBuster = "?v=" + new Date().getTime();
            
            // Update the source file of the core central frame with the fresh timestamp
            document.getElementById('content-frame').src = targetPage + cacheBuster;
            
            // Clean active classes off all existing buttons
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active-tab');
            });
            
            // Apply blue highlight style to the active selected tab button
            document.getElementById(clickedTabId).classList.add('active-tab');
        }
    </script>

</body>
</html>
